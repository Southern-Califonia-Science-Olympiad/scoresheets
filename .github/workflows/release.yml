name: Release

# Publishes every checklist (.pdf) and scoresheet (.xlsx) as release assets.
#   git tag 27.1.0 && git push origin 27.1.0
# or run it manually from the Actions tab with a tag name.
#
# Tags are <season year suffix>.<release number>.<hotfix>: 27.1.0 is the first
# 2027 release, 27.1.1 a hotfix to it, 27.2.0 the next regular release. Each
# release attaches the current version of every file, so a tag says nothing
# about which individual scoresheets changed; use the generated notes for that.

on:
  push:
    tags: ["[0-9][0-9].[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (e.g. 27.1.0)
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{2}\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like <season year suffix>.<release>.<hotfix>, e.g. 27.1.0" >&2
            exit 1
          fi

      # Reuse the Tests workflow instead of re-running the suites here.
      - name: Require a passing test run for this commit
        run: |
          passed=$(gh run list --repo "${{ github.repository }}" \
            --workflow tests.yml --commit "${{ github.sha }}" \
            --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "No successful Tests run for ${{ github.sha }}." >&2
            echo "Merge the commit to main (or run Tests manually on it) and wait for it to pass." >&2
            exit 1
          fi

      - uses: actions/checkout@v4.2.2

      - name: Collect assets
        # <Year><Event>/scoresheet_<div>.xlsx -> dist/<Year><Event><DIV>_scoresheet.xlsx
        # <Year><Event>/checklist_<div>.pdf -> dist/<Year><Event><DIV>_checklist.pdf
        run: |
          mkdir -p dist
          for f in 20*/scoresheet_*.xlsx 20*/checklist_*.pdf; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            base=$(basename "$f")
            if ! [[ "$base" =~ ^(scoresheet|checklist)_[a-z]+\.(xlsx|pdf)$ ]]; then
              echo "Unexpected filename (no revision suffixes allowed): $f" >&2
              exit 1
            fi
            kind=${base%%_*}
            rest=${base#*_}
            div=${rest%%[._]*}
            ext=${base##*.}
            out="dist/${dir}${div^^}_${kind}.${ext}"
            if [ -e "$out" ]; then
              echo "Name collision: $f -> $out already exists" >&2
              exit 1
            fi
            cp "$f" "$out"
          done
          ls -l dist

      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
